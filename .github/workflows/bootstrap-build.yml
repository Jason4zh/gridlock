name: bootstrap
on:
  push:
    branches: [ bbc6min-boot ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unpack
        run: |
          mkdir -p /tmp/src
          tar xf bootstrap.b64 -C /tmp/src
          ls /tmp/src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: build
        working-directory: /tmp/src
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: /tmp/src/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: bbc6min-latest
          name: BBC6Min latest debug
          files: /tmp/src/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: push-sources
        continue-on-error: true
        run: |
          git config user.name bot
          git config user.email bot@example.com
          rsync -a --delete --exclude .git /tmp/src/ ./
          git add -A
          git commit -m "import bbc6min sources" || true
          git push origin HEAD:bbc6min -f