name: bootstrap
on:
  push:
    branches: [ bbc6min-boot ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unpack
        run: |
          mkdir -p /tmp/src
          tar xf bootstrap.b64 -C /tmp/src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: build
        id: bld
        continue-on-error: true
        working-directory: /tmp/src
        run: |
          gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          tail -40 /tmp/build.log
      - name: publish-log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view bbc6min-logs >/dev/null 2>&1 || gh release create bbc6min-logs --title logs --notes logs
          gh release upload bbc6min-logs /tmp/build.log --clobber
      - name: publish-apk
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            gh release view bbc6min-latest >/dev/null 2>&1 || gh release create bbc6min-latest --title "BBC Courses" --notes apk
            gh release upload bbc6min-latest "$APK" --clobber
          fi
      - name: push-sources
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@example.com
          rsync -a --delete --exclude .git /tmp/src/ ./
          git add -A
          git commit -m "sync sources" || true
          git push origin HEAD:bbc6min -f