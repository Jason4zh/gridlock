name: bootstrap
on:
  push:
    branches: [ bbc6min-boot ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unpack
        run: |
          : > /tmp/src.tar
          for f in src.part*; do base64 -d "$f" >> /tmp/src.tar; done
          mkdir -p /tmp/src
          tar xf /tmp/src.tar -C /tmp/src
          ls /tmp/src | head
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: prepare-keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/src
          gh release download bbc6min-keys -p app.keystore --clobber 2>/dev/null || true
          if [ ! -f app.keystore ]; then
            keytool -genkeypair -v -keystore app.keystore -storepass bbc6min -keypass bbc6min -alias bbc6min -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BBC Courses,O=jason,C=CN"
            gh release create bbc6min-keys --title keys --notes "stable signing key" || true
            gh release upload bbc6min-keys app.keystore --clobber
          fi
          ls -l app.keystore
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: build
        id: bld
        continue-on-error: true
        working-directory: /tmp/src
        run: |
          gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          tail -40 /tmp/build.log
      - name: publish-log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view bbc6min-logs >/dev/null 2>&1 || gh release create bbc6min-logs --title logs --notes logs
          gh release upload bbc6min-logs /tmp/build.log --clobber
      - name: publish-apk
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            gh release view bbc6min-latest >/dev/null 2>&1 || gh release create bbc6min-latest --title "BBC Courses" --notes apk
            gh release upload bbc6min-latest "$APK" --clobber
          fi