name: bootstrap
on:
  push:
    branches: [ bbc6min-boot ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unpack
        run: |
          cat src.part* > /tmp/src.tar
          mkdir -p /tmp/src
          tar xf /tmp/src.tar -C /tmp/src
          if [ -d overlay ]; then cp -a overlay/. /tmp/src/; echo applied overlay; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: prepare-keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: Jason4zh/GridLock
        run: |
          gh release download bbc6min-keys -R "$R" -p app.keystore -D /tmp/src --clobber 2>/dev/null || true
          if [ ! -f /tmp/src/app.keystore ]; then
            cd /tmp/src
            keytool -genkeypair -v -keystore app.keystore -storepass bbc6min -keypass bbc6min -alias bbc6min -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BBC Courses,O=jason,C=CN"
            gh release create bbc6min-keys -R "$R" --title keys --notes "signing" || true
            gh release upload bbc6min-keys -R "$R" /tmp/src/app.keystore --clobber
          fi
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: build
        continue-on-error: true
        working-directory: /tmp/src
        run: |
          gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          tail -40 /tmp/build.log
      - name: publish-log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: Jason4zh/GridLock
        run: |
          gh release view bbc6min-logs -R "$R" >/dev/null 2>&1 || gh release create bbc6min-logs -R "$R" --title logs --notes logs
          gh release upload bbc6min-logs -R "$R" /tmp/build.log --clobber
      - name: publish-apk
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: Jason4zh/GridLock
        run: |
          APK=/tmp/src/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            gh release view bbc6min-latest -R "$R" >/dev/null 2>&1 || gh release create bbc6min-latest -R "$R" --title "BBC Courses" --notes apk
            gh release upload bbc6min-latest -R "$R" "$APK" --clobber
          fi