plugins {
    id 'com.android.application'
}

// A stable signing key for CI builds. The workflow downloads it from the
// "bbc6min-keys" release (creating it on first run), so every APK we ship has
// the same signature and can be installed over the previous one.
def stableKs = rootProject.file('app.keystore')

android {
    namespace 'com.jason.bbccourses'
    compileSdk 34

    signingConfigs {
        if (stableKs.exists()) {
            stable {
                storeFile stableKs
                storePassword 'bbc6min'
                keyAlias 'bbc6min'
                keyPassword 'bbc6min'
            }
        }
    }

    defaultConfig {
        applicationId "com.jason.bbccourses"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.6.0"
        vectorDrawables.useSupportLibrary true
    }

    buildTypes {
        debug {
            if (stableKs.exists()) signingConfig signingConfigs.stable
        }
        release {
            if (stableKs.exists()) signingConfig signingConfigs.stable
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'androidx.media3:media3-datasource:1.3.1'
    implementation 'androidx.media3:media3-database:1.3.1'
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}